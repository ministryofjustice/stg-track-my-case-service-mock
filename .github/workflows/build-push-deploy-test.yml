name: CI/CD test

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: test-mock
  cancel-in-progress: false

jobs:
  build-push-test:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: test
    outputs:
      new_tag: ${{ steps.set-version-tag-output.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        id: bump-id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          PRERELEASE: true
          PRERELEASE_SUFFIX: test

      - name: Set version tag output
        id: set-version-tag-output
        run: echo "new_tag=${{ steps.bump-id.outputs.new_tag }}" >> $GITHUB_OUTPUT

      - name: Build image
        env:
          NEW_TAG_V: ${{ steps.set-version-tag-output.outputs.new_tag }}
        shell: bash
        run: |
          docker build . \
            --build-arg BUILD_NUMBER="$NEW_TAG_V" \
            --build-arg GIT_REF=${{ github.sha }} \
            --build-arg GIT_BRANCH=${{ github.ref_name }} \
            -t "working_image:$NEW_TAG_V"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TEST_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.TEST_ECR_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.TEST_ECR_REPOSITORY }}
          NEW_TAG_V: ${{ steps.set-version-tag-output.outputs.new_tag }}
        shell: bash
        run: |
          docker tag "working_image:$NEW_TAG_V" "$ECR_REGISTRY/$ECR_REPOSITORY:$NEW_TAG_V"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$NEW_TAG_V"

  deploy-test:
    needs: build-push-test
    name: Deploy Helm chart (Cloud Platform)
    if: ${{ needs.build-push-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to the cluster
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
        run: |
          echo "${{ secrets.KUBE_CERT }}" > ca.crt
          kubectl config set-cluster "${KUBE_CLUSTER}" --certificate-authority=./ca.crt --server="https://${KUBE_CLUSTER}"
          kubectl config set-credentials deploy-user --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context "${KUBE_CLUSTER}" --cluster="${KUBE_CLUSTER}" --user=deploy-user --namespace="${{ secrets.KUBE_NAMESPACE }}"
          kubectl config use-context "${KUBE_CLUSTER}"

      - name: Clone Helm chart repo
        run: |
          git clone https://github.com/ministryofjustice/track-my-case-cloud-platform.git
          git -C track-my-case-cloud-platform checkout main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TEST_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.TEST_ECR_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Adopt webapp-cp resources into app release
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          RELEASE_NAME: ${{ github.event.repository.name }}-test
        run: |
          PATCH='{"metadata":{"annotations":{"meta.helm.sh/release-name":"'"$RELEASE_NAME"'","meta.helm.sh/release-namespace":"'"$KUBE_NAMESPACE"'"}}}'
          for resource in \
            "networkpolicy/allow-prometheus-scraping" \
            "servicemonitor/$KUBE_NAMESPACE" ; do
            if kubectl get $resource -n "$KUBE_NAMESPACE" >/dev/null 2>&1; then
              echo "Patching $resource..."
              kubectl patch $resource -n "$KUBE_NAMESPACE" --type=merge -p "$PATCH"
            else
              echo "$resource not found — skipping"
            fi
          done

      - name: Helm upgrade (WireMock image — no TMC_* app secrets)
        env:
          APP_ROLE_ARN: ${{ secrets.APP_ROLE_ARN }}
          ECR_REPO_WEBAPP: ${{ steps.login-ecr.outputs.registry }}/${{ vars.TEST_ECR_REPOSITORY }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          NEW_TAG_V: ${{ needs.build-push-test.outputs.new_tag }}
          RELEASE_NAME: ${{ github.event.repository.name }}-test
        run: |
          if helm status "$RELEASE_NAME" -n "$KUBE_NAMESPACE" >/dev/null 2>&1; then
            state=$(helm status "$RELEASE_NAME" -n "$KUBE_NAMESPACE" -o json 2>/dev/null | jq -r '.info.status | select(.!=null)')
            if [[ "$state" == pending-* ]]; then
              prev=$(helm history "$RELEASE_NAME" -n "$KUBE_NAMESPACE" -o json | jq '[.[] | select(.status=="deployed")][-1].revision')
              if [[ -n "$prev" ]]; then
                helm rollback "$RELEASE_NAME" "$prev" -n "$KUBE_NAMESPACE" || true
              fi
            fi
          fi

          helm upgrade --install --dry-run --debug --namespace "$KUBE_NAMESPACE" "$RELEASE_NAME" ./track-my-case-cloud-platform/charts/webapp-cp \
            --set Namespace="$KUBE_NAMESPACE" \
            --set WebApp.Image.Repository="$ECR_REPO_WEBAPP" \
            --set WebApp.Image.Tag="$NEW_TAG_V" \
            --set WebApp.Name="$KUBE_NAMESPACE" \
            --set Ingress.ModSec.Enabled=true \
            --set securityContext.allowPrivilegeEscalation=false \
            --set securityContext.capabilities.drop=["ALL"] \
            --set securityContext.runAsNonRoot=true \
            --set securityContext.seccompProfile.type="RuntimeDefault" \
            --set Networkpolicy.Ingress="track-my-case-test" \
            --set ServiceAccount.RoleARN="$APP_ROLE_ARN"

          helm upgrade --install --atomic --wait --timeout 10m0s --namespace "$KUBE_NAMESPACE" "$RELEASE_NAME" ./track-my-case-cloud-platform/charts/webapp-cp \
            --set Namespace="$KUBE_NAMESPACE" \
            --set WebApp.Image.Repository="$ECR_REPO_WEBAPP" \
            --set WebApp.Image.Tag="$NEW_TAG_V" \
            --set WebApp.Name="$KUBE_NAMESPACE" \
            --set Ingress.ModSec.Enabled=true \
            --set securityContext.allowPrivilegeEscalation=false \
            --set securityContext.capabilities.drop=["ALL"] \
            --set securityContext.runAsNonRoot=true \
            --set securityContext.seccompProfile.type="RuntimeDefault" \
            --set Networkpolicy.Ingress="track-my-case-test" \
            --set ServiceAccount.RoleARN="$APP_ROLE_ARN"

          kubectl label service --overwrite=true "$KUBE_NAMESPACE" "app=$KUBE_NAMESPACE"
